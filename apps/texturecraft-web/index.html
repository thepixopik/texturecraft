<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>The AllCraft Texture</title>
  <link data-trunk rel="rust" data-bin="texturecraft-web" data-cargo-profile="wasm-release" data-wasm-opt="0" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1c1c1f; }
    #texturecraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #texturecraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #c9c9ce; font: 14px system-ui, sans-serif; pointer-events: none; background: #1c1c1f; }
  </style>
</head>
<body>
  <canvas id="texturecraft_canvas"></canvas>
  <div id="texturecraft_loading" role="status" aria-live="polite">
    <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ececef">Loading The AllCraft Texture&hellip;</div>
    <div style="width:240px;height:5px;background:#323238;border-radius:999px;overflow:hidden">
      <div id="tc_load_bar" style="width:2%;height:100%;background:#fb7185;border-radius:999px;transition:width 0.12s ease-out"></div>
    </div>
    <div id="tc_load_pct" style="margin-top:8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums">Starting&hellip;</div>
    <progress id="texturecraft_progress" max="1" hidden></progress>
    <p id="texturecraft_status" hidden></p>
  </div>
</body>
</html>
